name: Sync Discotech Flyers

on:
  schedule:
    # Run every Monday at 2 AM UTC (10 PM ET Sunday)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-flyers:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run flyer sync script
        run: node scripts/sync-discotech-flyers.mjs

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/event-flyers/
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync Discotech flyers for $(date -u +%Y-%m-%d)"
            git push
          fi
