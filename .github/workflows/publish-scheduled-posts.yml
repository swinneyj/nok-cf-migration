name: Publish Scheduled Blog Posts

on:
  schedule:
    - cron: '0 14 * * 2,4' # 9AM EST (14 UTC), Tues & Thurs
  workflow_dispatch:
    inputs:
      slug:
        description: 'Publish a specific scheduled post slug now (optional)'
        required: false
      random:
        description: 'Publish one random scheduled post now (true/false)'
        required: false
        default: 'false'
      force:
        description: 'Overwrite app/blog/<slug> if it already exists (true/false)'
        required: false
        default: 'false'
      dry_run:
        description: 'Preview what would publish without changing the repo (true/false)'
        required: false
        default: 'false'

jobs:
  publish-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for scheduled posts
        id: check_posts
        shell: bash
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          
          POSTS=""
          if [ -d "_scheduled-posts" ]; then
            SLUG_INPUT="${{ github.event.inputs.slug }}"
            RANDOM_INPUT="${{ github.event.inputs.random }}"

            if [ -n "$SLUG_INPUT" ]; then
              match=$(ls -d "_scheduled-posts/"*"_${SLUG_INPUT}/" 2>/dev/null | head -n 1 || true)
              if [ -n "$match" ]; then
                POSTS="$match"
              fi
            elif [ "$RANDOM_INPUT" = "true" ]; then
              match=$(ls -d _scheduled-posts/*/ 2>/dev/null | shuf -n 1 || true)
              if [ -n "$match" ]; then
                POSTS="$match"
              fi
            else
            for dir in _scheduled-posts/*/; do
              [ -d "$dir" ] || continue
              folder=$(basename "$dir")
              pub_date="${folder:0:10}"
              
              if [[ "$pub_date" < "$TODAY" || "$pub_date" == "$TODAY" ]]; then
                POSTS="$POSTS $dir"
              fi
            done
            fi
          fi
          
          if [ -z "$POSTS" ]; then
            echo "found_posts=false" >> $GITHUB_OUTPUT
          else
            echo "found_posts=true" >> $GITHUB_OUTPUT
            echo "posts=$POSTS" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_posts.outputs.found_posts == 'true' && github.event.inputs.dry_run != 'true'
        run: npm install node-fetch

      - name: Generate images for posts
        if: steps.check_posts.outputs.found_posts == 'true' && github.event.inputs.dry_run != 'true'
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        shell: bash
        run: |
          node scripts/generate-blog-images.js "${{ steps.check_posts.outputs.posts }}" "${{ steps.check_posts.outputs.today }}"

      - name: Publish due posts
        if: steps.check_posts.outputs.found_posts == 'true' && github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          set -e

          COUNT=0
          POSTS="${{ steps.check_posts.outputs.posts }}"
          FORCE_INPUT="${{ github.event.inputs.force }}"

          for dir in $POSTS; do
            [ -d "$dir" ] || continue

            folder=$(basename "$dir")
            slug="${folder:11}"

            if [ -d "app/blog/$slug" ] && [ "$FORCE_INPUT" != "true" ]; then
              echo "Skipping (already exists): $folder -> app/blog/$slug"
              continue
            fi

            echo "Publishing $folder -> app/blog/$slug"
            rm -rf "app/blog/$slug"
            mkdir -p "app/blog/$slug"
            cp -r "${dir}"* "app/blog/$slug/"
            rm -rf "$dir"
            COUNT=$((COUNT + 1))
          done

          echo "Published: $COUNT"

      - name: Rebuild blog index
        if: steps.check_posts.outputs.found_posts == 'true' && github.event.inputs.dry_run != 'true'
        run: node scripts/rebuild-blog-index.mjs

      - name: Commit and push changes
        if: steps.check_posts.outputs.found_posts == 'true' && github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          set -e

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.email "justin.swinney88@gmail.com"
          git config user.name "Auto-Publisher"

          git add app/blog/ _scheduled-posts/ scripts/rebuild-blog-index.mjs
          git commit -m "Auto-published $(date -u +%Y-%m-%d)"
          git push
